name: Bug Report
description: Report a bug or unexpected behaviour in SmartHelm
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.
        Please fill in as much detail as possible so we can reproduce and fix it quickly.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system is affected?
      options:
        - Android App (detection / overlay / service)
        - Fleet Dashboard (web)
        - Pi Backend (inference / streams)
        - Firebase / Cloud Function
        - Hardware (ESP32-CAM / MAX30102 / SIM800L)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "e.g. The overlay widget disappears after switching to Google Maps."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behaviour.
      placeholder: |
        1. Launch the SmartHelm app
        2. Start detection service
        3. Switch to Google Maps
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include any error messages or logs.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / OS
      description: "Android model + Android version, or Pi model + OS, or browser + OS."
      placeholder: "e.g. Samsung Galaxy S23, Android 14 / Raspberry Pi 4B, Raspberry Pi OS Bookworm"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App / Commit Version
      description: Git commit hash or app version code (shown in MainActivity title bar).
      placeholder: "e.g. commit ba55444 / v0.9.2"

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant logcat output, Python tracebacks, or browser console errors.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have NOT included any API keys, passwords, or other secrets in this report.
          required: true
