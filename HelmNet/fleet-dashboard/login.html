<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartHelm Fleet — Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>△ SmartHelm Fleet</h1>
      <p>Sign in to monitor your riders in real time.</p>
      <button class="btn-google" id="btn-google-signin">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20H24v8h11.3C33.7 33.9 29.3 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 6 1.1 8.1 3l5.7-5.7C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c10.5 0 20-7.5 20-21 0-1.4-.1-2.7-.4-4z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3.1 0 6 1.1 8.1 3l5.7-5.7C34.6 5.1 29.6 3 24 3 16.3 3 9.7 7.9 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 45c5.5 0 10.5-1.9 14.3-5.1l-6.6-5.4C29.7 36.1 27 37 24 37c-5.3 0-9.7-3.1-11.3-7.6L6.1 34c3.3 6.9 10 11 17.9 11z"/>
          <path fill="#1976D2" d="M43.6 20H24v8h11.3c-.9 2.6-2.6 4.8-4.8 6.3l6.6 5.4C41.5 36.2 44 30.6 44 24c0-1.4-.1-2.7-.4-4z"/>
        </svg>
        Sign in with Google
      </button>
      <p id="error-msg" style="color:#ff4444;margin-top:16px;font-size:12px;display:none"></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { firebaseConfig }  from './firebase.config.js';
    import { initAuth, signInWithGoogle, waitForAuth } from './auth.js';

    const app  = initializeApp(firebaseConfig);
    const auth = initAuth(app);

    // If already signed in, go to dashboard
    waitForAuth().then(user => {
        if (user) window.location.href = 'index.html';
    });

    document.getElementById('btn-google-signin').addEventListener('click', async () => {
        try {
            await signInWithGoogle();
            window.location.href = 'index.html';
        } catch (e) {
            const el = document.getElementById('error-msg');
            el.style.display = 'block';
            el.textContent   = 'Sign-in failed: ' + e.message;
        }
    });
  </script>
</body>
</html>
