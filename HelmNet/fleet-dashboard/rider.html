<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartHelm — Rider Detail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">△ SmartHelm <span>Fleet</span></div>
    <div class="header-right">
      <button class="btn-signout" id="btn-signout">Sign Out</button>
    </div>
  </header>

  <main>
    <div class="detail-header">
      <a href="index.html">← Fleet</a>
      <h2 id="rider-title" style="color:#e0e0e0;font-size:18px">Loading…</h2>
      <span id="rider-status-badge"></span>
    </div>

    <!-- Live stats cards -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="label">Eye State</div>
        <div class="value" id="stat-eye">—</div>
      </div>
      <div class="stat-card">
        <div class="label">PERCLOS</div>
        <div class="value" id="stat-perclos">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Continuous Closure</div>
        <div class="value" id="stat-closure">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Session Alerts</div>
        <div class="value" id="stat-alerts">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Status</div>
        <div class="value" id="stat-status">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Last Location</div>
        <div class="value" id="stat-location" style="font-size:14px">—</div>
      </div>
    </div>

    <!-- Alert history -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="section-title">Alert History</div>
      <button class="btn-export" id="btn-export">Export CSV</button>
    </div>

    <div class="table-wrap" style="margin-bottom:32px">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Type</th>
            <th>PERCLOS</th>
            <th>Closure (s)</th>
            <th>Location</th>
          </tr>
        </thead>
        <tbody id="alert-table-body">
          <tr><td colspan="5" style="text-align:center;color:#666;padding:24px">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Hourly chart -->
    <div class="section-title" style="margin-bottom:12px">Alerts per hour</div>
    <div class="table-wrap" style="padding:16px;margin-bottom:32px">
      <svg id="chart-svg" width="100%" height="120" viewBox="0 0 600 120" preserveAspectRatio="none">
        <text x="300" y="64" fill="#666" font-size="13" text-anchor="middle">No data yet</text>
      </svg>
    </div>
  </main>

  <script type="module" src="rider.js"></script>
</body>
</html>
