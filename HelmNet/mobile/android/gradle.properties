# Android/AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official

# JVM heap — prevents "GC overhead limit exceeded" on MediaPipe download
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.nio.channels.spi.SelectorProvider=sun.nio.ch.WindowsSelectorProvider

# Parallel builds
org.gradle.parallel=true
org.gradle.caching=true
